<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code ダッシュボード</title>
<link rel="icon" href="data:,">
<style>
:root {
  color-scheme: light dark;
  --bg: #f5f3ee;
  --panel: #ffffff;
  --col: #ebe8e1;
  --ink: #1f1d1a;
  --muted: #8b867c;
  --line: #dedad1;
  --accent: #c15f3c;
  --accent-ink: #ffffff;
  --busy-bg: #fdecc8;
  --busy-ink: #8a5a00;
  --idle-bg: #dcefe2;
  --idle-ink: #1f6b3d;
  --shadow: 0 1px 2px rgb(0 0 0 / .06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171614;
    --panel: #23211e;
    --col: #1d1b19;
    --ink: #ece8e0;
    --muted: #8f897e;
    --line: #37342f;
    --accent: #d97757;
    --accent-ink: #1a1512;
    --busy-bg: #4a3a12;
    --busy-ink: #f3cf7a;
    --idle-bg: #1c3a29;
    --idle-ink: #8fd4a8;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

header { padding: 14px 20px 0; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
header h1 { font-size: 17px; margin: 0; letter-spacing: .01em; }
header .meta { color: var(--muted); font-size: 12px; }
header .spacer { flex: 1; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 5px 12px; font-size: 12px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.ghost { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 5px 8px; border-radius: 6px; }
.ghost:hover { color: var(--ink); background: var(--col); }

.live { padding: 12px 20px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.live .label { color: var(--muted); font-size: 12px; margin-right: 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); background: var(--panel); border-radius: 10px;
  padding: 6px 12px; box-shadow: var(--shadow);
}
.chip b { font-weight: 600; }
.chip small { color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.busy { background: #e0a100; animation: pulse 1.4s ease-in-out infinite; }
.dot.idle { background: #3aa567; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .dot.busy { animation: none; } }

.filters {
  margin: 12px 20px 0; padding: 10px 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.filters .label { color: var(--muted); font-size: 12px; }
.filters select, .filters input[type="search"] {
  border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 8px; font-size: 12px;
}
.filters input[type="search"] { width: 200px; }
.filters label { font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.filters .count { color: var(--muted); font-size: 12px; margin-left: auto; }

main { flex: 1; min-height: 0; padding: 12px 20px 16px; }

.board { height: 100%; display: flex; gap: 12px; overflow-x: auto; }
.column {
  flex: none; width: 320px; max-height: 100%;
  display: flex; flex-direction: column;
  background: var(--col); border: 1px solid var(--line); border-radius: 12px;
}
.column > h2 {
  margin: 0; padding: 10px 12px 8px; font-size: 13px;
  display: flex; align-items: center; gap: 8px;
}
.column > h2 .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.column > h2 .n { color: var(--muted); font-weight: 400; font-size: 12px; }
.column > h2 .n.on { color: var(--idle-ink); font-weight: 600; }
.cards { overflow-y: auto; padding: 0 8px 8px; display: flex; flex-direction: column; gap: 8px; }

.card {
  text-align: left; width: 100%;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; box-shadow: var(--shadow);
  display: block;
}
.card:hover, .card:focus-visible { border-color: var(--accent); outline: none; }
.card .top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.card .top time { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; }
.badge { font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 5px; white-space: nowrap; }
.badge.claude { background: var(--accent); color: var(--accent-ink); }
.badge.busy { background: var(--busy-bg); color: var(--busy-ink); }
.badge.idle { background: var(--idle-bg); color: var(--idle-ink); }
.card .title { font-weight: 600; font-size: 13.5px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card .title.untitled { color: var(--muted); font-weight: 400; }
.card .snippet { color: var(--muted); font-size: 12px; margin-top: 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card .foot { color: var(--muted); font-size: 11px; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.list { height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.list table { width: 100%; border-collapse: collapse; }
.list th { position: sticky; top: 0; background: var(--panel); text-align: left; font-size: 11px; color: var(--muted); font-weight: 500; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.list td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
.list td.t { white-space: normal; min-width: 260px; }
.list td.num { text-align: right; font-variant-numeric: tabular-nums; }
.list tr[data-id] { cursor: pointer; }
.list tr[data-id]:hover { background: var(--col); }
.list .sub { color: var(--muted); font-size: 12px; }

.empty { color: var(--muted); padding: 48px; text-align: center; width: 100%; }

dialog.drawer {
  margin: 0 0 0 auto; height: 100dvh; max-height: none; width: min(720px, 100vw); max-width: none;
  border: 0; border-left: 1px solid var(--line); padding: 0;
  background: var(--bg); color: var(--ink);
}
dialog.drawer[open] { display: flex; flex-direction: column; }
dialog.drawer::backdrop { background: rgb(0 0 0 / .35); }
.d-head { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
.d-head .row { display: flex; align-items: flex-start; gap: 10px; }
.d-head h2 { margin: 0; font-size: 16px; flex: 1; }
.d-meta { margin: 10px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; font-size: 12px; }
.d-meta dt { color: var(--muted); }
.d-meta dd { margin: 0; overflow-wrap: anywhere; }
.d-meta a { color: var(--accent); }
.actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; font-size: 12.5px; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
.cmd { font: 11.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); margin-top: 8px; overflow-wrap: anywhere; user-select: all; }
.d-body { flex: 1; overflow-y: auto; padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 10px; }
.note { color: var(--muted); font-size: 12px; text-align: center; }
.msg { border-radius: 10px; padding: 8px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); }
.msg.assistant { background: var(--col); }
.msg .who { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; white-space: normal; }
.tool { font: 11.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); padding: 0 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool b { color: var(--ink); font-weight: 500; }

#toast {
  position: fixed; left: 50%; bottom: 24px; translate: -50% 0;
  background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 12.5px;
  opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; max-width: 80vw;
}
#toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Claude Code ダッシュボード</h1>
  <span class="meta" id="headMeta">読み込み中…</span>
  <span class="spacer"></span>
  <span class="seg" id="viewSeg">
    <button data-v="board">ボード</button><button data-v="list">リスト</button>
  </span>
  <button class="ghost" id="reload">更新</button>
</header>

<section class="live" id="live" hidden></section>

<section class="filters">
  <span class="label">並べ方</span>
  <span class="seg" id="groupSeg">
    <button data-v="project">プロジェクト</button><button data-v="status">状態</button><button data-v="date">日付</button><button data-v="branch">ブランチ</button><button data-v="kind">種類</button>
  </span>
  <select id="project" aria-label="プロジェクト"></select>
  <select id="period" aria-label="期間">
    <option value="1">24時間</option>
    <option value="7">1週間</option>
    <option value="14">2週間</option>
    <option value="30">1ヶ月</option>
    <option value="0">すべての期間</option>
  </select>
  <label><input type="checkbox" id="liveOnly"> 稼働中だけ</label>
  <input type="search" id="q" placeholder="絞り込む">
  <span class="count" id="count"></span>
</section>

<main id="main"></main>

<dialog class="drawer" id="drawer">
  <div class="d-head" id="dHead"></div>
  <div class="d-body" id="dBody"></div>
</dialog>
<div id="toast" role="status"></div>

<script>
// Rust 側（src-tauri）のコマンドを呼ぶ。失敗時はメッセージ文字列が投げられる
const call = (cmd, args) => window.__TAURI__.core.invoke(cmd, args).catch((e) => {
  throw new Error(typeof e === 'string' ? e : e?.message || 'エラーが発生しました');
});
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const DEFAULTS = { view: 'board', group: 'project', project: '', period: '14', liveOnly: false, q: '' };
const state = { ...DEFAULTS };
try { Object.assign(state, JSON.parse(localStorage.getItem('dash') || '{}')); } catch {}
const save = () => { try { localStorage.setItem('dash', JSON.stringify(state)); } catch {} };

let data = { now: Date.now(), home: '', sessions: [] };
let lastBody = '';
let openId = null;

// ---------- 表示用ヘルパー ----------

const DAY = 86400000;
function ago(t) {
  const d = Date.now() - t;
  if (d < 60000) return 'たった今';
  if (d < 3600000) return Math.floor(d / 60000) + '分前';
  if (d < DAY) return Math.floor(d / 3600000) + '時間前';
  if (d < 30 * DAY) return Math.floor(d / DAY) + '日前';
  return new Date(t).toLocaleDateString('ja-JP');
}
const fmtDate = (t) => new Date(t).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
function fmtSize(n) {
  if (n < 1024) return n + 'B';
  if (n < 1048576) return (n / 1024).toFixed(1) + 'KB';
  return (n / 1048576).toFixed(1) + 'MB';
}
const fmtTokens = (n) => (n >= 1000 ? Math.round(n / 1000) + 'k' : String(n));
const tilde = (p) => (p && data.home && p.startsWith(data.home) ? '~' + p.slice(data.home.length) : p || '');
function shortPath(p) {
  const t = tilde(p);
  const parts = t.split('/').filter(Boolean);
  return parts.length > 3 ? '…/' + parts.slice(-2).join('/') : t;
}
const baseName = (p) => (p || '').split('/').filter(Boolean).pop() || '(不明)';
const statusOf = (s) => (s.live ? (s.live.status === 'busy' ? 'busy' : 'idle') : 'stopped');
const STATUS_LABEL = { busy: '作業中', idle: '待機中', stopped: '停止' };
const kindOf = (s) => (s.entrypoint === 'claude-desktop' ? 'デスクトップ' : s.entrypoint === 'cli' || !s.entrypoint ? 'ターミナル' : s.entrypoint);
const titleOf = (s) => s.title || s.firstPrompt || '(無題)';
function hue(str) {
  let h = 0;
  for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360;
  return h;
}

// ---------- 絞り込み・グルーピング ----------

function filtered() {
  const q = state.q.trim().toLowerCase();
  const since = Number(state.period) ? Date.now() - Number(state.period) * DAY : 0;
  return data.sessions.filter((s) => {
    if (state.project && s.cwd !== state.project) return false;
    if (state.liveOnly && !s.live) return false;
    // 稼働中のセッションは期間外でも隠さない
    if (since && s.updatedAt < since && !s.live) return false;
    if (q) {
      const hay = [s.title, s.firstPrompt, s.lastPrompt, s.cwd, s.branch, s.id, s.live?.name].join('\n').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function dateBucket(t) {
  const start = new Date();
  start.setHours(0, 0, 0, 0);
  const d = start.getTime() - t;
  if (d <= 0) return ['0', '今日'];
  if (d <= DAY) return ['1', '昨日'];
  if (d <= 7 * DAY) return ['2', '7日以内'];
  if (d <= 30 * DAY) return ['3', '30日以内'];
  return ['4', 'それ以前'];
}

function grouped(list) {
  const groups = new Map();
  const add = (key, label, title, s) => {
    if (!groups.has(key)) groups.set(key, { key, label, title, items: [] });
    groups.get(key).items.push(s);
  };
  for (const s of list) {
    if (state.group === 'project') add(s.cwd || '?', baseName(s.cwd), tilde(s.cwd), s);
    else if (state.group === 'status') add(statusOf(s), STATUS_LABEL[statusOf(s)], '', s);
    else if (state.group === 'date') { const [k, l] = dateBucket(s.updatedAt); add(k, l, '', s); }
    else if (state.group === 'kind') add(kindOf(s), kindOf(s), '', s);
    else add(s.branch || '', s.branch || '(ブランチなし)', '', s);
  }
  const out = [...groups.values()];
  if (state.group === 'status') {
    const order = ['busy', 'idle', 'stopped'];
    out.sort((a, b) => order.indexOf(a.key) - order.indexOf(b.key));
  } else if (state.group === 'date') {
    out.sort((a, b) => a.key.localeCompare(b.key));
  } else {
    // 稼働中のものがある列を先頭に、あとは最終更新順
    const rank = (g) => (g.items.some((s) => s.live) ? 1 : 0);
    out.sort((a, b) => rank(b) - rank(a) || b.items[0].updatedAt - a.items[0].updatedAt);
  }
  return out;
}

// ---------- 描画 ----------

function statusBadge(s) {
  const st = statusOf(s);
  return st === 'stopped' ? '' : `<span class="badge ${st}">${STATUS_LABEL[st]}</span>`;
}

function cardHtml(s) {
  const foot = [shortPath(s.cwd), s.branch, fmtSize(s.size)].filter(Boolean).join(' · ');
  const snippet = s.lastPrompt && s.lastPrompt !== titleOf(s) ? `<div class="snippet">${esc(s.lastPrompt)}</div>` : '';
  return `<button class="card" data-id="${s.id}">
    <div class="top"><span class="badge claude">Claude</span>${statusBadge(s)}<time>${ago(s.updatedAt)}</time></div>
    <div class="title${s.title || s.firstPrompt ? '' : ' untitled'}">${esc(titleOf(s))}</div>
    ${snippet}
    <div class="foot" title="${esc(tilde(s.cwd))}">${esc(foot)}</div>
  </button>`;
}

function boardHtml(list) {
  return `<div class="board">${grouped(list).map((g) => {
    const on = g.items.filter((s) => s.live).length;
    return `<section class="column" data-key="${esc(g.key)}">
      <h2 title="${esc(g.title)}"><span class="dot" style="background:hsl(${hue(g.key)} 55% 50%)"></span>
        <span class="name">${esc(g.label)}</span>${on ? `<span class="n on">${on}</span>` : ''}<span class="n">${g.items.length}</span></h2>
      <div class="cards">${g.items.map(cardHtml).join('')}</div>
    </section>`;
  }).join('')}</div>`;
}

function listHtml(list) {
  return `<div class="list"><table>
    <thead><tr><th>状態</th><th>タイトル</th><th>プロジェクト</th><th>ブランチ</th><th>更新</th><th>プロンプト</th><th>サイズ</th><th>コスト</th></tr></thead>
    <tbody>${list.map((s) => `<tr data-id="${s.id}" tabindex="0">
      <td>${statusBadge(s) || '<span class="sub">停止</span>'}</td>
      <td class="t"><div>${esc(titleOf(s))}</div>${s.lastPrompt ? `<div class="sub">${esc(s.lastPrompt.slice(0, 90))}</div>` : ''}</td>
      <td title="${esc(tilde(s.cwd))}">${esc(baseName(s.cwd))}</td>
      <td class="sub">${esc(s.branch || '')}</td>
      <td class="sub">${ago(s.updatedAt)}</td>
      <td class="num">${s.prompts}</td>
      <td class="num sub">${fmtSize(s.size)}</td>
      <td class="num sub">${s.costUSD != null ? '$' + s.costUSD.toFixed(2) : ''}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

function renderLive() {
  const live = data.sessions.filter((s) => s.live);
  const el = $('live');
  el.hidden = live.length === 0;
  el.innerHTML = `<span class="label">稼働中のセッション</span>` + live.map((s) => {
    const st = statusOf(s);
    return `<button class="chip" data-id="${s.id}"><span class="dot ${st}"></span><b>${esc(s.title || s.live.name || baseName(s.cwd))}</b>
      <small>${STATUS_LABEL[st]} · ${esc(baseName(s.cwd))}</small></button>`;
  }).join('');
}

function renderProjectOptions() {
  const projects = new Map();
  for (const s of data.sessions) if (s.cwd) projects.set(s.cwd, (projects.get(s.cwd) || 0) + 1);
  const sel = $('project');
  sel.innerHTML = `<option value="">プロジェクト: すべて</option>` +
    [...projects].sort((a, b) => a[0].localeCompare(b[0])).map(([p, n]) => `<option value="${esc(p)}">${esc(shortPath(p))} (${n})</option>`).join('');
  if (state.project && !projects.has(state.project)) state.project = '';
  sel.value = state.project;
}

function render() {
  // 再描画でスクロール位置が飛ばないよう退避して戻す
  const main = $('main');
  const scroll = { left: main.querySelector('.board')?.scrollLeft || 0, list: main.querySelector('.list')?.scrollTop || 0, cols: {} };
  main.querySelectorAll('.column').forEach((c) => (scroll.cols[c.dataset.key] = c.querySelector('.cards').scrollTop));

  const list = filtered();
  const live = data.sessions.filter((s) => s.live).length;
  $('headMeta').textContent = `${new Date(data.now).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })} 現在 · 全 ${data.sessions.length} 件 · 稼働中 ${live}`;
  $('count').textContent = `読み取り専用 · ${list.length} 件`;
  for (const b of $('viewSeg').children) b.setAttribute('aria-pressed', b.dataset.v === state.view);
  for (const b of $('groupSeg').children) b.setAttribute('aria-pressed', b.dataset.v === state.group);
  $('groupSeg').style.opacity = state.view === 'board' ? 1 : 0.4;
  $('period').value = state.period;
  $('liveOnly').checked = state.liveOnly;
  if ($('q').value !== state.q) $('q').value = state.q;
  renderLive();
  renderProjectOptions();

  main.innerHTML = list.length === 0
    ? `<div class="empty">条件に合うセッションがありません</div>`
    : state.view === 'board' ? boardHtml(list) : listHtml(list);

  const board = main.querySelector('.board');
  if (board) board.scrollLeft = scroll.left;
  const listEl = main.querySelector('.list');
  if (listEl) listEl.scrollTop = scroll.list;
  main.querySelectorAll('.column').forEach((c) => {
    if (scroll.cols[c.dataset.key]) c.querySelector('.cards').scrollTop = scroll.cols[c.dataset.key];
  });
}

// ---------- 詳細ドロワー ----------

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove('show'), 3200);
}

function headHtml(s, command) {
  const rows = [
    ['場所', esc(tilde(s.cwd))],
    ['ブランチ', esc(s.branch || '—')],
    ['期間', `${fmtDate(s.startedAt)} 〜 ${fmtDate(s.updatedAt)}（${ago(s.updatedAt)}）`],
    ['やりとり', `プロンプト ${s.prompts} · 応答 ${s.turns} · ${fmtSize(s.size)}`],
    ['種類', esc(kindOf(s))],
    ['モデル', esc([s.model, s.contextTokens ? `コンテキスト ${fmtTokens(s.contextTokens)}` : '', s.version ? `v${s.version}` : ''].filter(Boolean).join(' · ') || '—')],
  ];
  if (s.costUSD != null) rows.push(['コスト', `$${s.costUSD.toFixed(2)}` + (s.linesAdded != null ? ` · +${s.linesAdded} / -${s.linesRemoved} 行` : '')]);
  if (s.prUrl && /^https:\/\//.test(s.prUrl)) rows.push(['PR', `<a href="${esc(s.prUrl)}" data-act="open">${esc(s.prUrl)}</a>`]);
  rows.push(['ID', esc(s.id)]);
  const primary = s.live
    ? `<button class="btn primary" data-act="focus">iTerm2 で表示</button>`
    : `<button class="btn primary" data-act="resume"${command ? '' : ' disabled'}>iTerm2 で再開</button>`;
  return `<div class="row">
      <span class="badge claude">Claude</span>${statusBadge(s)}
      <h2>${esc(titleOf(s))}</h2>
      <button class="ghost" data-act="close" aria-label="閉じる">閉じる</button>
    </div>
    <dl class="d-meta">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
    <div class="actions">${primary}
      <button class="btn" data-act="copy"${command ? '' : ' disabled'}>再開コマンドをコピー</button>
      <button class="btn" data-act="id">ID をコピー</button>
    </div>
    ${command ? `<div class="cmd">${esc(command)}</div>` : ''}`;
}

function bodyHtml(d) {
  if (!d.items.length) return `<div class="note">表示できる会話がありません</div>`;
  const note = d.total > d.items.length ? `<div class="note">直近 ${d.items.length} 件を表示（全 ${d.total} 件）</div>` : '';
  return note + d.items.map((m) => {
    if (m.role === 'tool') return `<div class="tool"><b>${esc(m.name)}</b> ${esc(m.text)}</div>`;
    const who = m.role === 'user' ? 'あなた' : 'Claude';
    return `<div class="msg ${m.role}"><span class="who">${who}${m.ts ? ' · ' + fmtDate(Date.parse(m.ts)) : ''}</span>${esc(m.text)}</div>`;
  }).join('');
}

let detail = null;
async function openSession(id) {
  openId = id;
  const dlg = $('drawer');
  const known = data.sessions.find((s) => s.id === id);
  $('dHead').innerHTML = known ? headHtml(known, null) : '';
  $('dBody').innerHTML = `<div class="note">読み込み中…</div>`;
  if (!dlg.open) dlg.showModal();
  history.replaceState(null, '', '#' + id);
  try {
    const j = await call('get_session', { id });
    if (openId !== id) return;
    detail = j;
    $('dHead').innerHTML = headHtml(j.summary, j.command);
    $('dBody').innerHTML = bodyHtml(j);
    $('dBody').scrollTop = $('dBody').scrollHeight; // 最新のやりとりから見せる
  } catch (e) {
    $('dBody').innerHTML = `<div class="note">${esc(e.message || '読み込みに失敗しました')}</div>`;
  }
}

$('drawer').addEventListener('close', () => {
  openId = null;
  detail = null;
  history.replaceState(null, '', location.pathname);
});
$('drawer').addEventListener('click', (e) => {
  if (e.target === $('drawer')) $('drawer').close(); // 背景クリックで閉じる
});
$('dHead').addEventListener('click', async (e) => {
  const target = e.target.closest('[data-act]');
  const act = target?.dataset.act;
  if (!act) return;
  if (act === 'open') e.preventDefault(); // 外部リンクはアプリ内で開かず既定のブラウザへ
  try {
    if (act === 'close') $('drawer').close();
    else if (act === 'open') await call('open_url', { url: target.href });
    else if (act === 'resume') { await call('resume_session', { id: openId }); toast('iTerm2 でセッションを再開しました'); }
    else if (act === 'focus') { await call('focus_session', { id: openId }); toast('iTerm2 のタブを表示しました'); }
    else if (act === 'copy') { await navigator.clipboard.writeText(detail.command); toast('再開コマンドをコピーしました'); }
    else if (act === 'id') { await navigator.clipboard.writeText(openId); toast('セッション ID をコピーしました'); }
  } catch (err) {
    toast(err.message);
  }
});

// ---------- イベント・ポーリング ----------

function onPick(e) {
  const id = e.target.closest('[data-id]')?.dataset.id;
  if (id) openSession(id);
}
$('main').addEventListener('click', onPick);
$('main').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('tr[data-id]')) onPick(e); });
$('live').addEventListener('click', onPick);

function bindSeg(id, key) {
  $(id).addEventListener('click', (e) => {
    const v = e.target.dataset?.v;
    if (!v) return;
    state[key] = v;
    save();
    render();
  });
}
bindSeg('viewSeg', 'view');
bindSeg('groupSeg', 'group');
$('project').addEventListener('change', (e) => { state.project = e.target.value; save(); render(); });
$('period').addEventListener('change', (e) => { state.period = e.target.value; save(); render(); });
$('liveOnly').addEventListener('change', (e) => { state.liveOnly = e.target.checked; save(); render(); });
$('q').addEventListener('input', (e) => { state.q = e.target.value; save(); render(); });
$('reload').addEventListener('click', () => refresh(true));

let lastRender = 0;
async function refresh(force) {
  try {
    const next = await call('get_sessions');
    const sig = JSON.stringify(next.sessions);
    // 変化がなければ再描画しない（相対時刻のために 1 分に 1 回は描く）
    if (!force && sig === lastBody && Date.now() - lastRender < 60000) return;
    lastBody = sig;
    data = next;
    lastRender = Date.now();
    render();
  } catch {
    $('headMeta').textContent = 'セッションを読み込めませんでした';
  }
}

refresh(true).then(() => {
  const id = location.hash.slice(1);
  if (/^[0-9a-f-]{36}$/.test(id)) openSession(id);
});
setInterval(() => { if (!document.hidden) refresh(); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
